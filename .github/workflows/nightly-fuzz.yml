name: Nightly deep fuzz

# Per-push CI runs the property suite at the smoke level (FAST_CHECK_NUM_RUNS
# default 50). This scheduled job fuzzes the same properties at 1000 iterations
# so deep fuzzing is continuous rather than never-in-CI, off the per-slice
# critical path. GitHub emails the repo owner on scheduled-workflow failure.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (runs on the default branch)
  workflow_dispatch: {} # manual deep run on demand

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAST_CHECK_NUM_RUNS: 1000
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deep property fuzz
        run: npx vitest run tests/property
