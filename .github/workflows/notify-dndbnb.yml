name: Notify dndbnb

# On every push to main, fires a `repository_dispatch: engine-updated`
# event at greghcarr/dndbnb. dndbnb's deploy workflow listens for that
# event and rebuilds, so engine slices auto-redeploy the consumer.
#
# One-time setup required:
#   1. Generate a fine-grained personal access token scoped to
#      greghcarr/dndbnb with `Actions: write` and `Metadata: read`.
#   2. In this repo's Settings -> Secrets and variables -> Actions,
#      add the token as `DNDBNB_DISPATCH_TOKEN`.
#
# If the secret is absent, this workflow no-ops silently (the gh CLI
# call exits non-zero but the step is `continue-on-error: true`).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-dndbnb
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at greghcarr/dndbnb
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DNDBNB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DNDBNB_DISPATCH_TOKEN not configured; skipping dispatch."
            exit 0
          fi
          gh api -X POST repos/greghcarr/dndbnb/dispatches \
            -f event_type=engine-updated \
            -F client_payload[sha]=${{ github.sha }} \
            -F client_payload[ref]=${{ github.ref }}
